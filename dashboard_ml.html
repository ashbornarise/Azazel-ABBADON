<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rex Clemens — Cerveau ML</title>
<style>
  :root { --bg:#0d1117; --s:#161b22; --b:#21262d; --fg:#c9d1d9; --fg2:#8b949e; --hi:#e6edf3; --g:#3fb950; --r:#f85149; --y:#d29922; --bl:#58a6ff; --p:#bc8cff; --o:#f0883e }
  *{box-sizing:border-box;margin:0}
  body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--fg);padding:16px}
  .top{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--b);margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .top h1{font-size:15px;color:var(--hi)} .top small{color:var(--fg2);font-size:11px}
  .brain{display:inline-block;margin-right:6px;font-size:14px}
  .nav{display:flex;gap:8px;margin-bottom:14px}
  .nav a{color:var(--bl);font-size:12px;text-decoration:none;padding:4px 12px;border:1px solid var(--b);border-radius:12px;background:var(--s)}
  .nav a:hover{background:var(--b)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
  .c{background:var(--s);border:1px solid var(--b);border-radius:6px;padding:12px}
  .cl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2);margin-bottom:4px}
  .cv{font-size:20px;font-weight:700;color:var(--hi);font-variant-numeric:tabular-nums}
  .cs{font-size:10px;color:var(--fg2);margin-top:2px}
  .green{color:var(--g)} .red{color:var(--r)} .yellow{color:var(--y)} .blue{color:var(--bl)} .purple{color:var(--p)} .orange{color:var(--o)}
  .badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:600}
  .badge-g{background:rgba(63,185,80,.15);color:var(--g)}
  .badge-r{background:rgba(248,81,73,.15);color:var(--r)}
  .badge-y{background:rgba(210,153,34,.15);color:var(--y)}
  .section{font-size:13px;font-weight:600;color:var(--hi);margin:18px 0 8px}
  .footer{text-align:center;padding:20px 0;color:var(--fg2);font-size:10px}
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
  .chart-box canvas{width:100%;height:200px;display:block}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;padding:8px 10px;font-size:11px;color:var(--fg2);text-transform:uppercase;border-bottom:1px solid var(--b)}
  td{padding:8px 10px;border-bottom:1px solid var(--b)} tr:last-child td{border-bottom:none}
  .bar-row{display:flex;align-items:center;gap:6px;margin:3px 0}
  .bar-label{font-size:11px;color:var(--fg);width:110px;text-align:right;flex-shrink:0}
  .bar-track{flex:1;height:14px;background:var(--b);border-radius:3px;overflow:hidden;position:relative}
  .bar-fill{height:100%;border-radius:3px;transition:width .3s}
  .bar-val{font-size:10px;color:var(--fg2);width:40px;flex-shrink:0}
  .actif-card{margin-bottom:16px}
  .actif-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
  .proba-box{display:flex;gap:4px;align-items:center}
  .proba-bar{width:120px;height:20px;border-radius:4px;overflow:hidden;display:flex}
  .proba-up{background:var(--g);height:100%}
  .proba-down{background:var(--r);height:100%}
  @media(max-width:700px){.grid{grid-template-columns:1fr 1fr} .charts-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top">
  <div>
    <h1><span class="brain">&#129504;</span>Rex Clemens — Cerveau ML</h1>
    <small>Random Forest · Walk-Forward · 11 Features · Analyse temps réel</small>
  </div>
  <div id="ts" style="font-size:11px;color:var(--fg2)"></div>
</div>

<div class="nav">
  <a href="/">Trading Live</a>
  <a href="/ml" style="background:var(--b);color:var(--hi)">Cerveau ML</a>
</div>

<!-- MODEL INFO -->
<div class="grid" id="modelCards"></div>

<!-- PER-ASSET ML DETAILS -->
<div id="actifs"></div>

<div class="footer">
  Simulation éducative · Random Forest Walk-Forward · Aucun argent réel
</div>

<script>
const FEAT_COLORS = {
  'ret_1j':'#58a6ff','ret_5j':'#79c0ff','ret_20j':'#a5d6ff',
  'vol_10j':'#f85149','vol_20j':'#ff7b72',
  'ma_ratio_5_20':'#3fb950','ma_ratio_20_60':'#56d364',
  'rsi_14':'#d29922',
  'dist_haut_20j':'#bc8cff',
  'amplitude_5j':'#f0883e',
  'skew_20j':'#8b949e'
};
const FEAT_DESC = {
  'ret_1j':'Rendement 1 jour','ret_5j':'Rendement 5 jours','ret_20j':'Rendement 20 jours',
  'vol_10j':'Volatilité 10j','vol_20j':'Volatilité 20j',
  'ma_ratio_5_20':'Ratio MA 5/20','ma_ratio_20_60':'Ratio MA 20/60',
  'rsi_14':'RSI 14 jours',
  'dist_haut_20j':'Dist. plus haut 20j',
  'amplitude_5j':'Amplitude 5j',
  'skew_20j':'Skewness 20j'
};

function drawLineChart(canvas, labels, data, color, opts={}) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = {t:14,r:12,b:28,l:40};
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;

  ctx.clearRect(0,0,W,H);
  if (!data.length) return;

  let minV = Math.min(...data), maxV = Math.max(...data);
  if (minV === maxV) { minV -= 1; maxV += 1; }
  const m = (maxV - minV) * 0.08;
  minV -= m; maxV += m;
  const rng = maxV - minV;

  // Grid
  ctx.strokeStyle = '#21262d'; ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + cH * (1 - i/4);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W-pad.r, y); ctx.stroke();
    ctx.fillStyle = '#8b949e'; ctx.font = '9px -apple-system,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((minV + rng*i/4).toFixed(1), pad.l-4, y+3);
  }

  // 50% line
  if (opts.midLine) {
    const y50 = pad.t + cH * (1 - (50 - minV) / rng);
    if (y50 > pad.t && y50 < pad.t + cH) {
      ctx.strokeStyle = '#8b949e'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(pad.l, y50); ctx.lineTo(W-pad.r, y50); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#8b949e'; ctx.font = '9px -apple-system,sans-serif';
      ctx.fillText('50%', pad.l - 4, y50 - 4);
    }
  }

  // Area fill
  ctx.fillStyle = color + '18';
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad.l + (i / Math.max(1, data.length-1)) * cW;
    const y = pad.t + cH * (1 - (v - minV) / rng);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.l + cW, pad.t + cH);
  ctx.lineTo(pad.l, pad.t + cH);
  ctx.closePath(); ctx.fill();

  // Line
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = pad.l + (i / Math.max(1, data.length-1)) * cW;
    const y = pad.t + cH * (1 - (v - minV) / rng);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Last dot
  if (data.length) {
    const lx = pad.l + cW;
    const ly = pad.t + cH * (1 - (data[data.length-1] - minV) / rng);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e6edf3'; ctx.font = 'bold 11px -apple-system,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(data[data.length-1].toFixed(1) + '%', lx - 8, ly - 8);
  }

  // X labels
  ctx.fillStyle = '#8b949e'; ctx.font = '9px -apple-system,sans-serif'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(labels.length / 5));
  for (let i = 0; i < labels.length; i += step) {
    ctx.fillText(labels[i], pad.l + (i / Math.max(1, labels.length-1)) * cW, H - pad.b + 14);
  }
}

async function load() {
  try {
    const r = await fetch('/api/ml');
    const d = await r.json();
    if (!d || !d.modele) {
      document.getElementById('actifs').innerHTML = '<div class="c" style="text-align:center;padding:40px"><div class="cv yellow">En attente de la première analyse ML...</div><div class="cs" style="margin-top:8px">Le robot effectue sa première analyse au démarrage, puis toutes les heures</div></div>';
      return;
    }

    document.getElementById('ts').textContent = 'Dernière analyse : ' + d.timestamp;

    const nbActifs = Object.keys(d.actifs).length;
    const accMoy = Object.values(d.actifs).filter(a => a.accuracy_test).map(a => a.accuracy_test);
    const avgAcc = accMoy.length ? (accMoy.reduce((a,b) => a+b, 0) / accMoy.length).toFixed(1) : '-';

    document.getElementById('modelCards').innerHTML = `
      <div class="c"><div class="cl">Modèle</div><div class="cv blue" style="font-size:16px">${d.modele}</div><div class="cs">${d.arbres} arbres</div></div>
      <div class="c"><div class="cl">Features</div><div class="cv purple">${d.nb_features}</div><div class="cs">Signaux techniques</div></div>
      <div class="c"><div class="cl">Walk-Forward</div><div class="cv green">OUI</div><div class="cs">Anti look-ahead bias</div></div>
      <div class="c"><div class="cl">Jours train</div><div class="cv">${d.taille_train}</div><div class="cs">≈ 1 an glissant</div></div>
      <div class="c"><div class="cl">Ré-entraînement</div><div class="cv orange">${d.pas_reentrain}j</div><div class="cs">≈ toutes les 3 sem.</div></div>
      <div class="c"><div class="cl">Actifs analysés</div><div class="cv">${nbActifs}</div></div>
      <div class="c"><div class="cl">Accuracy moy. test</div><div class="cv ${parseFloat(avgAcc) > 52 ? 'green' : 'yellow'}">${avgAcc}%</div></div>
    `;

    let html = '';
    for (const [sym, a] of Object.entries(d.actifs)) {
      const bc = a.decision === 'ACHAT' ? 'g' : a.decision === 'CASH' ? 'r' : 'y';
      const accTrainClass = a.accuracy_train > 55 ? 'green' : a.accuracy_train > 50 ? 'yellow' : 'red';
      const accTestClass = a.accuracy_test && a.accuracy_test > 52 ? 'green' : a.accuracy_test && a.accuracy_test > 50 ? 'yellow' : 'red';

      html += `<div class="actif-card">
        <div class="section">${a.nom} <span style="color:var(--fg2);font-weight:400;font-size:11px">${sym}</span></div>
        <div class="c">
          <div class="actif-header">
            <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
              <div><span style="font-size:10px;color:var(--fg2)">SIGNAL</span><br><span class="badge badge-${bc}" style="font-size:14px">${a.decision}</span></div>
              <div><span style="font-size:10px;color:var(--fg2)">EXPOSITION</span><br><span style="font-size:18px;font-weight:700;color:var(--hi)">${a.exposition}%</span></div>
              <div><span style="font-size:10px;color:var(--fg2)">PRIX</span><br><span style="font-size:14px;color:var(--hi)">${a.prix.toLocaleString('fr-FR')} $</span></div>
            </div>
            <div>
              <div style="font-size:10px;color:var(--fg2);margin-bottom:4px">PRÉDICTION ML</div>
              <div class="proba-box">
                <span class="green" style="font-size:12px;font-weight:600">${a.proba_hausse}%</span>
                <div class="proba-bar">
                  <div class="proba-up" style="width:${a.proba_hausse}%"></div>
                  <div class="proba-down" style="width:${a.proba_baisse}%"></div>
                </div>
                <span class="red" style="font-size:12px;font-weight:600">${a.proba_baisse}%</span>
              </div>
            </div>
          </div>

          <!-- ACCURACY -->
          <div style="display:flex;gap:20px;margin:12px 0;flex-wrap:wrap">
            <div><span style="font-size:10px;color:var(--fg2)">ACCURACY TRAIN</span><br>
              <span class="${accTrainClass}" style="font-size:16px;font-weight:700">${a.accuracy_train}%</span>
              <span style="font-size:10px;color:var(--fg2)">(${a.jours_entrainement} jours)</span></div>
            <div><span style="font-size:10px;color:var(--fg2)">ACCURACY TEST</span><br>
              <span class="${accTestClass || 'yellow'}" style="font-size:16px;font-weight:700">${a.accuracy_test ? a.accuracy_test + '%' : 'N/A'}</span></div>
          </div>

          <!-- FEATURE IMPORTANCE -->
          <div style="font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px">Importance des features</div>`;

      if (a.feature_importance) {
        for (const [feat, imp] of Object.entries(a.feature_importance)) {
          const color = FEAT_COLORS[feat] || '#8b949e';
          const desc = FEAT_DESC[feat] || feat;
          const val = a.feature_valeurs ? a.feature_valeurs[feat] : '';
          html += `<div class="bar-row">
            <div class="bar-label" title="${desc}">${desc}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.min(imp * 4, 100)}%;background:${color}"></div></div>
            <div class="bar-val">${imp}%</div>
          </div>`;
        }
      }

      html += `
          <!-- FEATURE VALUES -->
          <div style="font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px">Valeurs actuelles des features</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">`;
      if (a.feature_valeurs) {
        for (const [feat, val] of Object.entries(a.feature_valeurs)) {
          const desc = FEAT_DESC[feat] || feat;
          const color = FEAT_COLORS[feat] || '#8b949e';
          html += `<div style="background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:4px 8px;font-size:11px">
            <span style="color:${color}">${desc}</span><br>
            <span style="color:var(--hi);font-weight:600">${typeof val === 'number' ? val.toFixed(4) : val}</span>
          </div>`;
        }
      }
      html += `</div>`;

      // Expo history chart
      const canvasId = 'expoChart_' + sym.replace(/[^a-zA-Z0-9]/g,'_');
      html += `
          <div style="font-size:11px;color:var(--fg2);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px">Historique d'exposition ML (30 derniers jours)</div>
          <canvas id="${canvasId}" style="height:160px;width:100%"></canvas>
        </div>
      </div>`;
    }

    document.getElementById('actifs').innerHTML = html;

    // Draw expo charts
    for (const [sym, a] of Object.entries(d.actifs)) {
      if (a.historique_expo && a.historique_expo.length > 0) {
        const canvasId = 'expoChart_' + sym.replace(/[^a-zA-Z0-9]/g,'_');
        const canvas = document.getElementById(canvasId);
        if (canvas) {
          const color = a.decision === 'ACHAT' ? '#3fb950' : a.decision === 'CASH' ? '#f85149' : '#d29922';
          drawLineChart(canvas, a.historique_dates || [], a.historique_expo, color, {midLine: true});
        }
      }
    }

  } catch(e) {
    console.error('Erreur:', e);
    document.getElementById('actifs').innerHTML = '<div class="c"><div class="cv red">Erreur de chargement</div></div>';
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
